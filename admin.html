<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Admin | Price Card</title>
<style>
:root{--bg:#1a0f14;--card:#26161e;--card2:#321d28;--gold:#e8b86d;--rose:#e87a9a;--text:#f7ecef;--muted:#b79aa6;--red:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}
h1{font-family:Georgia,serif;font-size:24px;color:var(--gold)}
h3{font-size:15px;color:var(--gold);margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top a{color:var(--muted);font-size:13px}
.box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid #ffffff10}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff1c;background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--card2);color:var(--text)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--rose));color:#1a0f14}
.btn.del{background:#ff6b6b22;color:var(--red);flex:0 0 auto;padding:10px 12px}
.btn.sm{padding:8px 10px;font-size:12px;flex:0 0 auto}
.btn.full{width:100%;margin-top:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.tabs button{flex:0 0 auto;border:1px solid #ffffff1c;background:var(--card);color:var(--muted);padding:9px 14px;border-radius:30px;font-weight:600;cursor:pointer}
.tabs button.active{background:var(--gold);color:#1a0f14;border-color:var(--gold)}
.pane{display:none}.pane.show{display:block}
.item{background:var(--bg);border-radius:12px;padding:10px;margin-top:10px;border:1px solid #ffffff10}
.item .row+.row{margin-top:8px}
.cat-head{display:flex;gap:8px;align-items:center}
.cat-head input.icon{flex:0 0 56px;text-align:center}
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.g-item{background:var(--bg);border-radius:12px;overflow:hidden;border:1px solid #ffffff10}
.g-item .media{aspect-ratio:1;background:#000;display:grid;place-items:center}
.g-item img,.g-item video{width:100%;height:100%;object-fit:cover}
.g-item .ctrl{padding:8px}
.g-item input{padding:8px;font-size:13px}
.g-item .row{margin-top:6px;gap:4px}
.drop{border:2px dashed #e8b86d66;border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop input{display:none}
.logo-prev{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--bg);display:block;margin-bottom:8px;border:2px solid var(--gold)}
.save-bar{position:fixed;bottom:0;left:0;right:0;padding:14px 16px;background:#1a0f14ee;backdrop-filter:blur(10px);border-top:1px solid #ffffff14}
.save-bar .btn{width:100%;max-width:528px;display:block;margin:0 auto;padding:15px;font-size:16px}
.dirty .save-bar .btn{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 24px #e8b86d99}}
.login{max-width:360px;margin:18vh auto 0;padding:0 20px;text-align:center}
.login .box{margin-top:20px;text-align:left}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:var(--gold);color:#1a0f14;padding:11px 20px;border-radius:30px;font-weight:700;transition:.3s;z-index:50;max-width:90vw}
.toast.show{transform:translate(-50%,0)}.toast.err{background:var(--red);color:#fff}
.progress{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:10px;display:none}
.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .2s}
.soc-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.soc-row span{flex:0 0 96px;font-size:14px}
</style>
</head>
<body>

<div id="loginView" class="login">
  <h1>✨ Admin Login</h1>
  <p class="hint">Manage your price card</p>
  <div class="box">
    <label>Password</label>
    <input type="password" id="pw" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn gold full" onclick="login()">Log in</button>
    <p id="loginErr" style="color:#ff8a8a;font-size:13px;margin-top:12px;line-height:1.5;display:none"></p>
  </div>
</div>

<div id="app" style="display:none">
<div class="wrap">
  <div class="top"><h1>✨ My Card</h1><div><a href="/" target="_blank">View card ↗</a> · <a href="#" onclick="logout()">Log out</a></div></div>
  <div class="tabs">
    <button class="active" data-p="profile">👤 Profile</button>
    <button data-p="socials">🔗 Socials</button>
    <button data-p="prices">💄 Prices</button>
    <button data-p="accounts">💳 Accounts</button>
    <button data-p="gallery">📸 Gallery</button>
  </div>
  <div id="profile" class="pane show"></div>
  <div id="socials" class="pane"></div>
  <div id="prices" class="pane"></div>
  <div id="accounts" class="pane"></div>
  <div id="gallery" class="pane"></div>
</div>
<div class="save-bar"><button class="btn gold" onclick="save()" id="saveBtn">💾 Save changes</button></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const $ = id => document.getElementById(id);
let D = null, PW = sessionStorage.getItem("pw") || "", MODE = "local";
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

function toast(msg, err){const t=$("toast");t.textContent=msg;t.className="toast show"+(err?" err":"");clearTimeout(t._t);t._t=setTimeout(()=>t.className="toast",2600)}
function showErr(m){const e=document.getElementById("loginErr");if(!e)return;e.textContent=m;e.style.display=m?"block":"none"}
function dirty(){document.body.classList.add("dirty")}

/* ---------- AUTH ---------- */
async function login(){
  const pw = ($("pw").value || PW).trim(); showErr("");
  let r;
  try{ r = await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})}); }
  catch(e){ toast("Can't reach the server. Open the site from its web link (Vercel or live preview).",1); return; }
  if(r.status===404||r.status>=500){ toast("Server error ("+r.status+"). Check ADMIN_PASSWORD and Blob storage on Vercel, then redeploy.",1); return; }
  if(!r.ok){ let m="Login failed"; try{m=(await r.json()).error||m}catch(e){} showErr(m); sessionStorage.removeItem("pw"); return; }
  const j = await r.json(); MODE = j.mode; PW = pw; sessionStorage.setItem("pw", pw);
  D = await (await fetch("/api/data",{cache:"no-store"})).json();
  D.socials = Object.assign({instagram:"",tiktok:"",facebook:"",whatsapp:"",youtube:""}, Array.isArray(D.socials)?{}:D.socials);
  $("loginView").style.display="none"; $("app").style.display="block";
  renderAll();
}
window.login = login;
window.logout = () => { sessionStorage.removeItem("pw"); location.reload(); };
if (PW) login();

/* ---------- SAVE ---------- */
window.save = async () => {
  const b=$("saveBtn"); b.textContent="Saving..."; b.disabled=true;
  try{
    const r = await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":PW},body:JSON.stringify(D)});
    if(!r.ok) throw new Error((await r.json()).error||"Save failed");
    document.body.classList.remove("dirty"); toast("Saved! Your card is updated ✓");
  }catch(e){toast(e.message,1)}
  b.textContent="💾 Save changes"; b.disabled=false;
};

/* ---------- UPLOAD ---------- */
async function uploadFile(file, onProgress){
  if (MODE === "blob") {
    const { upload } = await import("https://esm.sh/@vercel/blob@1.1.1/client");
    const clean = file.name.replace(/[^\w.-]/g,"_");
    const r = await upload("media/"+clean, file, {
      access:"public", handleUploadUrl:"/api/upload", clientPayload: PW,
      onUploadProgress: p => onProgress && onProgress(p.percentage)
    });
    return r.url;
  }
  const r = await fetch("/api/upload?name="+encodeURIComponent(file.name),{method:"POST",headers:{"x-admin-password":PW},body:file});
  if(!r.ok) throw new Error("Upload failed");
  onProgress && onProgress(100);
  return (await r.json()).url;
}
async function removeMedia(url){
  fetch("/api/delete",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":PW},body:JSON.stringify({url})}).catch(()=>{});
}

/* ---------- generic binding ---------- */
// inputs with data-path="a.b.0.c" write into D
document.addEventListener("input", e => {
  const p = e.target.dataset.path; if(!p) return;
  const keys = p.split("."); let o = D;
  keys.slice(0,-1).forEach(k => o = o[k]);
  const last = keys.at(-1);
  o[last] = e.target.type==="number" ? (e.target.value===""?"":Number(e.target.value)) : e.target.value;
  dirty();
});
const inp = (path, val, ph="", type="text") => `<input type="${type}" data-path="${path}" value="${esc(val)}" placeholder="${esc(ph)}">`;

function renderAll(){ renderProfile(); renderSocials(); renderPrices(); renderAccounts(); renderGallery(); }

/* ---------- PROFILE ---------- */
function renderProfile(){
  $("profile").innerHTML = `
  <div class="box"><h3>Logo / Photo</h3>
    ${D.logo?`<img class="logo-prev" src="${esc(D.logo)}">`:`<div class="logo-prev"></div>`}
    <div class="row"><label class="btn" style="text-align:center;margin:0">📷 ${D.logo?"Change":"Upload"} photo<input type="file" accept="image/*" id="logoFile" hidden></label>
    ${D.logo?`<button class="btn del" id="logoDel">Remove</button>`:""}</div>
  </div>
  <div class="box"><h3>Details</h3>
    <label>Brand name</label>${inp("brand",D.brand,"e.g. Glam by Ada")}
    <label>Tagline</label>${inp("tagline",D.tagline,"Makeup Artist • Lagos")}
    <label>WhatsApp number for bookings</label>${inp("whatsapp",D.whatsapp,"2348012345678")}
    <p class="hint">Include country code, no + or spaces. Leave empty to hide the Book button.</p>
    <label>Currency symbol</label>${inp("currency",D.currency,"₦")}
  </div>`;
  $("logoFile").onchange = async e => {
    const f=e.target.files[0]; if(!f) return; toast("Uploading...");
    try{ const old=D.logo; D.logo = await uploadFile(f); if(old) removeMedia(old); renderProfile(); dirty(); toast("Photo uploaded. Tap Save ✓"); }catch(err){toast(err.message,1)}
  };
  if($("logoDel")) $("logoDel").onclick = () => { removeMedia(D.logo); D.logo=""; renderProfile(); dirty(); };
}

/* ---------- SOCIALS ---------- */
const SOC = [["instagram","📸 Instagram","instagram.com/yourhandle"],["tiktok","🎵 TikTok","tiktok.com/@yourhandle"],["facebook","📘 Facebook","facebook.com/yourpage"],["whatsapp","💬 WhatsApp","2348012345678 or wa.me link"],["youtube","▶️ YouTube","youtube.com/@yourchannel"]];
function renderSocials(){
  $("socials").innerHTML = `<div class="box"><h3>Social media links</h3>
    <p class="hint">Paste your profile links. Leave a box empty to hide that icon.</p>
    ${SOC.map(([k,l,ph])=>`<div class="soc-row"><span>${l}</span>${inp("socials."+k,D.socials[k],ph)}</div>`).join("")}
  </div>`;
}

/* ---------- PRICES ---------- */
function renderPrices(){
  $("prices").innerHTML = D.prices.map((c,ci)=>`
    <div class="box">
      <div class="cat-head">
        <input class="icon" data-path="prices.${ci}.icon" value="${esc(c.icon)}" placeholder="💄">
        <input data-path="prices.${ci}.category" value="${esc(c.category)}" placeholder="Category e.g. Gele">
        <button class="btn sm" onclick="moveCat(${ci},-1)">↑</button>
        <button class="btn del" onclick="delCat(${ci})">🗑</button>
      </div>
      ${c.items.map((it,ii)=>`
        <div class="item">
          <div class="row">${inp(`prices.${ci}.items.${ii}.name`,it.name,"Service name")}
            <button class="btn sm" onclick="moveItem(${ci},${ii},-1)">↑</button>
            <button class="btn del" onclick="delItem(${ci},${ii})">✕</button></div>
          <div class="row">${inp(`prices.${ci}.items.${ii}.price`,it.price,"Price","number")}
            ${inp(`prices.${ci}.items.${ii}.note`,it.note,"Note (optional)")}</div>
        </div>`).join("")}
      <button class="btn full" onclick="addItem(${ci})">+ Add service</button>
    </div>`).join("") + `<button class="btn gold full" onclick="addCat()">+ Add new category</button>
    <p class="hint" style="text-align:center">e.g. Lashes, Wig installation, Makeup classes</p>`;
}
window.addCat = () => { D.prices.push({category:"",icon:"✨",items:[{name:"",price:"",note:""}]}); renderPrices(); dirty(); };
window.delCat = i => { if(confirm("Delete this whole category?")){ D.prices.splice(i,1); renderPrices(); dirty(); } };
window.moveCat = (i,d) => { const j=i+d; if(j<0) return; [D.prices[i],D.prices[j]]=[D.prices[j],D.prices[i]]; renderPrices(); dirty(); };
window.addItem = ci => { D.prices[ci].items.push({name:"",price:"",note:""}); renderPrices(); dirty(); };
window.delItem = (ci,ii) => { D.prices[ci].items.splice(ii,1); renderPrices(); dirty(); };
window.moveItem = (ci,ii,d) => { const a=D.prices[ci].items, j=ii+d; if(j<0) return; [a[ii],a[j]]=[a[j],a[ii]]; renderPrices(); dirty(); };

/* ---------- ACCOUNTS ---------- */
function renderAccounts(){
  $("accounts").innerHTML = `<div class="box"><h3>Bank accounts</h3>
    ${D.accounts.map((a,i)=>`
      <div class="item">
        <div class="row">${inp(`accounts.${i}.bank`,a.bank,"Bank e.g. GTBank")}<button class="btn del" onclick="delAcct(${i})">✕</button></div>
        <div class="row">${inp(`accounts.${i}.number`,a.number,"Account number")}</div>
        <div class="row">${inp(`accounts.${i}.name`,a.name,"Account name")}</div>
      </div>`).join("")}
    <button class="btn full" onclick="addAcct()">+ Add account</button></div>
    <div class="box"><h3>Payment note</h3>
      <textarea data-path="paymentNote" placeholder="e.g. 50% deposit required">${esc(D.paymentNote)}</textarea></div>`;
}
window.addAcct = () => { D.accounts.push({bank:"",number:"",name:""}); renderAccounts(); dirty(); };
window.delAcct = i => { D.accounts.splice(i,1); renderAccounts(); dirty(); };

/* ---------- GALLERY ---------- */
function renderGallery(){
  $("gallery").innerHTML = `<div class="box"><h3>Gallery (${D.gallery.length})</h3>
    <label class="drop">📤 Tap to upload pictures or videos<br><small>You can select several at once</small>
      <input type="file" id="gFiles" accept="image/*,video/*" multiple></label>
    <div class="progress" id="prog"><div></div></div>
    <p class="hint" id="progTxt"></p>
    <div class="g-grid">
      ${D.gallery.map((g,i)=>`
        <div class="g-item">
          <div class="media">${g.type==="video"?`<video src="${esc(g.src)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(g.src)}" loading="lazy">`}</div>
          <div class="ctrl">
            ${inp(`gallery.${i}.caption`,g.caption,"Caption")}
            <div class="row">
              <button class="btn sm" onclick="moveG(${i},-1)">←</button>
              <button class="btn sm" onclick="moveG(${i},1)">→</button>
              <button class="btn del" onclick="delG(${i})">🗑</button>
            </div>
          </div>
        </div>`).join("")}
    </div></div>`;
  $("gFiles").onchange = async e => {
    const files=[...e.target.files]; if(!files.length) return;
    const bar=$("prog"), txt=$("progTxt"); bar.style.display="block";
    for(let k=0;k<files.length;k++){
      const f=files[k]; txt.textContent=`Uploading ${k+1} of ${files.length}: ${f.name}`;
      try{
        const url = await uploadFile(f, p => bar.firstElementChild.style.width=p+"%");
        D.gallery.unshift({type:f.type.startsWith("video")?"video":"image", src:url, caption:""});
      }catch(err){ toast(`${f.name}: ${err.message}`,1); }
    }
    dirty(); renderGallery(); toast("Uploaded! Add captions, then tap Save ✓");
  };
}
window.moveG = (i,d) => { const j=i+d; if(j<0||j>=D.gallery.length) return; [D.gallery[i],D.gallery[j]]=[D.gallery[j],D.gallery[i]]; renderGallery(); dirty(); };
window.delG = i => { if(!confirm("Delete this item?")) return; removeMedia(D.gallery[i].src); D.gallery.splice(i,1); renderGallery(); dirty(); };

/* ---------- tabs ---------- */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".pane").forEach(x=>x.classList.remove("show"));
  b.classList.add("active"); $(b.dataset.p).classList.add("show");
});
window.addEventListener("beforeunload", e => { if(document.body.classList.contains("dirty")){ e.preventDefault(); e.returnValue=""; } });
</script>
</body>
</html>
